<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">课程依赖关系</title>
  <desc id="desc">课程0指向课程1和2，课程2指向课程1，课程1指向课程3。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="480" height="280" fill="#fff"/>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M86 60 H201"/>
    <path d="M80 78 L208 191"/>
    <path d="M230 86 V181"/>
    <path d="M256 210 H391"/>
  </g>
  <g fill="#f5f5f5" stroke="#555" stroke-width="2">
    <circle cx="60" cy="60" r="26"/>
    <circle cx="230" cy="60" r="26"/>
    <circle cx="230" cy="210" r="26"/>
    <circle cx="420" cy="210" r="26"/>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#333" text-anchor="middle">
    <text x="60" y="68">0</text>
    <text x="230" y="68">2</text>
    <text x="230" y="218">1</text>
    <text x="420" y="218">3</text>
  </g>
</svg>
