<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="title desc">
  <title id="title">C++ 编译过程</title>
  <desc id="desc">源文件经过预处理、编译、汇编、链接，依次生成预处理文件、汇编文件、目标文件和可执行文件。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="720" height="170" fill="#fff"/>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M116 90 H154"/>
    <path d="M266 90 H304"/>
    <path d="M416 90 H454"/>
    <path d="M566 90 H604"/>
  </g>
  <g fill="#f5f5f5" stroke="#555">
    <rect x="10" y="65" width="106" height="50" rx="4"/>
    <rect x="160" y="65" width="106" height="50" rx="4"/>
    <rect x="310" y="65" width="106" height="50" rx="4"/>
    <rect x="460" y="65" width="106" height="50" rx="4"/>
    <rect x="610" y="65" width="106" height="50" rx="4"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">
    <text x="63" y="96">源文件 .cpp</text>
    <text x="213" y="96">预处理文件 .ii</text>
    <text x="363" y="96">汇编文件 .s</text>
    <text x="513" y="96">目标文件 .o</text>
    <text x="663" y="96">可执行文件</text>
    <text x="138" y="48">预处理</text>
    <text x="288" y="48">编译</text>
    <text x="438" y="48">汇编</text>
    <text x="588" y="48">链接</text>
  </g>
</svg>
